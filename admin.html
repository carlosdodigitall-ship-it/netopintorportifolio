<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Carlos Pintor</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f3f7fc}.admin-shell{max-width:980px;margin:50px auto;padding:20px}.panel{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px #153b6315;margin:20px 0}.form-grid{display:grid;gap:12px}input,select,button{font:inherit;padding:13px;border:1px solid #c7d7e8;border-radius:9px;max-width:100%}button{background:#1557aa;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:grid;gap:5px}.hidden{display:none!important}.photo-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:15px}.photo-list article{border:1px solid #dce6f0;border-radius:10px;padding:10px}.photo-list img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}.danger{background:#a82525}.muted{color:#456}#status{min-height:24px}</style></head><body><main class="admin-shell"><a href="/">← Voltar ao portfólio</a><h1>Administração • Carlos Pintor</h1><p>Gerencie suas fotografias reais por categoria.</p><p id="status" role="status"></p><section id="login" class="panel"><h2>Entrar</h2><form id="login-form" class="form-grid"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button></form><p class="muted">Somente usuários previamente autorizados podem publicar fotografias.</p></section><section id="dashboard" class="hidden"><button id="logout" type="button">Sair</button><div class="panel"><h2>Categorias</h2><form id="category-form" class="form-grid"><label>Nome da nova categoria<input id="category-name" required maxlength="80"></label><button>Criar categoria</button></form></div><div class="panel"><h2>Adicionar fotografias</h2><form id="upload-form" class="form-grid"><label>Categoria<select id="category" required></select></label><label>Descrição da foto<input id="caption" maxlength="180" placeholder="Ex.: Fachada em textura mineral"></label><label>Fotos reais (até 10 MB cada)<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple required></label><button id="upload-button">Publicar fotografias</button></form></div><div class="panel"><h2>Fotos publicadas</h2><div id="photos-list" class="photo-list"></div></div></section></main><script type="module" src="/admin.js"></script></body></html>
